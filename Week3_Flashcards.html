<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>
body{font-family:system-ui;background:#f2f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.wrap{width:min(420px,95vw);text-align:center}.card{height:260px;perspective:1000px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:16px;backface-visibility:hidden;color:#fff;font-size:1.2rem}
.front{background:#4caf50}.back{background:#2196f3;transform:rotateY(180deg)}button{margin:10px;padding:10px 18px}</style></head>
<body><div class=wrap><div id=card class=card><div class=inner><div id=q class='face front'></div><div id=a class='face back'></div></div></div>
<div><button id=prev onclick='prevCard()'>Previous</button><button id=next onclick='nextCard()'>Next</button></div><div id=c></div></div>
<script>
const flashcards=[{q:'Collaborative Customization',a:'Directly involving customers in the design process to create a tailored product.'},
{q:'Adaptive Customization',a:'Providing a standard product that customers can modify or adjust themselves after purchase.'},
{q:'Cosmetic Customization',a:'Altering the unique physical presentation, branding, or packaging of an identical product for different customer segments.'},
{q:'Transparent Customization',a:'Adapting products to unique individual consumer needs without explicitly telling the customer customization has occurred.'},
{q:'Broaden-the-Market Fallacy',a:'A strategic error where firms attempt to appeal to everyone and consequently lose a clear, defensible competitive position.'},
{q:'Relative Advantage',a:'A diffusion characteristic measuring whether target customers perceive an innovation as significantly superior to existing alternatives.'},
{q:'Compatibility',a:'How well an innovation naturally aligns with customers’ existing values, behavioral habits, and lifestyles.'},
{q:'Complexity',a:'A diffusion metric reflecting how difficult an innovation is for an average consumer to understand, operate, or use.'},
{q:'Trialability / Divisibility',a:'The relative ease with which customers can experiment with a product risk-free before committing to a full purchase.'},
{q:'Observability / Communicability',a:'How visible and easily recognized the benefits of an innovation are to other potential users in the marketplace.'},
{q:'Innovators',a:'The first customer category, willing to experiment with new technologies despite extreme initial uncertainty.'},
{q:'Early Adopters',a:"Respected opinion leaders who adopt early and strongly influence the wider market's purchasing behaviors."},
{q:'Early Majority',a:"The first large wave of mainstream consumers who adopt only after seeing clear evidence of an innovation's success."},
{q:'Late Majority',a:'Skeptical consumers who adopt an innovation late, typically due to intense social pressure, utility, or market necessity.'},
{q:'Laggards',a:'The final adopter category, actively resisting change and purchasing only when traditional alternatives disappear.'},
{q:'Crossing the Chasm',a:'The difficult strategic transition high-technology products must make to move from visionary early adopters to the pragmatic early majority.'},
{q:'First-Mover Advantage (Pioneering Strategy)',a:'Entering a market before any other competitors to capture early brand loyalty, set technical standards, and secure distribution channels.'},
{q:'Second-Mover Advantage (Fast Follower Strategy)',a:'Intentionally waiting for a pioneer to launch a product, studying their customer complaints and market mistakes, and then introducing a refined version.'},
{q:'Late-Entry Strategy',a:'Entering an established, mature market late by focusing on lower manufacturing costs, niche market segments, or price-sensitive buyers.'},
{q:'Product Scope',a:'Deciding whether a product will be launched globally across all operational sectors simultaneously or rolled out locally across distinct geographic stages.'},
{q:'Product Positioning Statement',a:'A strategic statement declaring exactly how a product delivers a unique benefit that fills an unmet consumer need compared to rival options.'},
{q:'Innovative Positioning',a:'Positioning a new item based on a brand-new functional technology or a performance benefit that has never existed in the marketplace.'},
{q:'Me-Too Positioning',a:'Positioning a product to match the core features and benefits of the current market leader, often competing on price or minor design tweaks.'},
{q:'Adaptive Positioning',a:'Positioning a product by taking an existing industry standard and tailoring it to a new target niche or demographic.'},
{q:'Surrogate Positioning',a:'Utilizing indirect external cues—such as price, country of origin, brand reputation, or celebrity endorsements—to communicate quality when technical performance cannot be directly evaluated.'},
{q:'Trademark & Service Mark',a:'Legal protections for words, names, symbols, or designs identifying specific goods or services.'},
{q:'Trade Name & Trade Dress',a:"Identifiers protecting either the name of the company itself or the distinctive physical appearance and layout associated with a product's packaging. e"},
{q:'Brand Equity',a:'The added financial or reputational value a recognized brand name gives to a product beyond its functional features.'},
{q:'Brand Extension',a:'Leveraging an existing, successful brand name to launch a completely new product category.'},
{q:'Line Extension',a:'Adding a new variety, flavor, size, or minor model variation to an already existing, active product line.'},
{q:'Flanker Brand',a:"Launching a separate, distinct brand name alongside a firm's core brand to capture a different price tier or consumer segment without diluting the primary brand."},
{q:'Dual Branding / Co-Branding',a:'Combining two established brand names onto a single product to leverage the reputation and customer base of both.'},
{q:'Brand Report Card',a:'A corporate assessment tool used to systematically evaluate branding performance across dimensions like relevance, consistency, and differentiation.'},
{q:'Umbrella Branding vs. Individual Branding',a:'Utilizing a single brand name across an entire family of products versus assigning unique, separate names to individual items.'},
{q:'Global Standardization vs. Adaptation',a:'Keeping a brand completely uniform worldwide for scale versus altering names and marketing strategies to fit local languages and cultures.'},
{q:'Strategic Packaging',a:"Designing a product's physical enclosure to simultaneously protect the item, satisfy legal regulations, support branding, and grab attention at the point of sale."},
{q:'Tactical Launch Marketing Mix',a:'The coordinated operational actions (Product, Price, Place, Promotion) executed to fulfill the strategic launch plan.'},
{q:'Launch Cycle',a:'An expansion of the introductory stage of the Product Life Cycle divided into prelaunch, announcement, beachhead, and early growth phases.'},
{q:'Preannouncement',a:'Intentionally releasing product information to the public, media, or investors months before actual commercial availability to build hype or retain customers.'},
{q:'Marketing Signaling',a:"Non-advertising mechanisms (such as equipment purchases, pricing adjustments, or executive speeches) that indicate a firm's future product intentions."},
{q:'Network Externalities (Direct & Indirect)',a:'An economic framework where a product grows exponentially more valuable as its user base expands (direct) or as complementary options increase (indirect).'},
{q:'Competitive Blocking Strategy',a:"Announcing an upcoming product early to strategically persuade target customers to delay purchasing a competitor's active offering."},
{q:'Vaporware',a:'A product that is pre-announced to the public but is delayed for months or canceled entirely before manufacturing begins.'},
{q:'Beachhead Phase',a:'The difficult initial market-entry period marked by very high marketing expenditures and highly volatile initial sales growth.'},
{q:'Lean Launch',a:'Utilizing supply chain flexibility to minimize initial manufacturing inventory while retaining the capacity to scale rapidly if demand climbs.'},
{q:'Time Postponement & Form Postponement',a:'Delaying inventory deployment until market demand is clear (time), or stalling final product configuration until late in the production line (form).'},
{q:'Awareness Actions',a:'Marketing activities—such as digital advertising, influencer campaigns, and public relations—designed to inform the target market that a product exists.'},
{q:'Communications Mix & Copy Strategy Statement',a:'A collaborative text providing creative guidance to promotional personnel by clarifying targets, positioning statements, and core messaging.'},
{q:'Personal Selling',a:'Utilizing a trained sales force to build business relationships, counter merchant resistance, and secure retail placement during launch.'},
{q:'Strategic Alliances',a:'Partnerships with external universities, labs, competitors, or logistics providers to access specialized launch capabilities.'},
{q:'Availability / Distribution Actions',a:'Actions taken to secure store shelf space, stock digital warehouses, and incentivize distributors to carry the product.'},
{q:'Distributor Motivation Techniques',a:'Promotional tools outlined to secure trade cooperation, including trade allowances, exclusive zones, margins, and merchandising aid.'},
{q:'Trial-Inducing Actions',a:'Operational tactics—such as free samples, temporary price discounts, coupons, and interactive in-store demonstrations—designed to get consumers to try a product for the first time.'},
{q:'Barriers to Trial',a:'Internal or external obstacles (such as high complexity, poor behavioral compatibility, or limited observability) that prevent rapid user trial.'},
{q:'Premium Pricing',a:"Establishing a permanently high price point that explicitly reflects a product's strong differentiation."},
{q:'Skimming Pricing Strategy',a:'Launching a product with a high initial price tag to extract maximum profits from early adopters before gradually lowering the price over time.'},
{q:'Meet-the-Market Pricing',a:'Setting pricing levels identical to active competitor positions to minimize price as a friction point.'},
{q:'Penetration Pricing Strategy',a:'Launching a product with an intentionally low price tag to quickly capture market share, build high sales volume, and block rivals.'},
{q:'Introductory Promotional Pricing',a:'Offering short-term discounts or limited-time bundles at launch to lower the financial risk for tentative buyers.'},
{q:'Slotting Allowances / Slotting Fees',a:'Direct cash payments made by a manufacturer to retail chains to secure physical shelf space for a new item.'},
{q:'Push Promotional Strategy',a:'Directing promotional efforts at distributors, wholesalers, and sales reps to push the product down through the supply chain.'},
{q:'Pull Promotional Strategy',a:'Directing advertising and consumer promotions at end-users to build high product demand, pulling it through the distribution channel.'},
{q:'Direct Distribution Channel',a:'Selling a new product directly from the manufacturer to the end-consumer without intermediaries (e.g., via a company website).'},
{q:'Indirect Distribution Channel',a:'Utilizing third-party wholesalers, brokers, and retail stores to distribute products to consumers.'},
{q:'Stockkeeping Unit (SKU)',a:'A unique identification code assigned to every distinct product variation (size, color, packaging) to manage inventory tracking.'},
{q:'Repeat-Purchase Actions',a:'Customer success tactics—such as loyalty programs, automatic subscriptions, and follow-up service warranties—designed to secure ongoing purchases.'},
{q:'Market Testing',a:'Evaluative activities conducted right before or during launch to gauge real-world consumer demand and fine-tune the final marketing mix.'},
{q:'Pseudo Market Testing',a:'Methods where consumers do not actually buy a product in a real retail setting, but their purchase intentions are recorded in simulated scenarios.'},
{q:'Speculative Sale',a:'A B2B market testing method where salespeople pitch the final product concept to industrial buyers and ask if they would buy it, without full production being live.'},
{q:'Simulated Test Market (STM)',a:'A mathematical and behavioral testing format where consumers are exposed to product advertisements and then placed in a mock or digital retail environment to shop.'},
{q:'Controlled Market Testing',a:'An evaluative method where a product is distributed through a small, select group of real-world stores that have agreed to stock the item in exchange for a fee.'},
{q:'Minimarkets',a:'A controlled testing layout where an item is placed exclusively in a small number of real, cooperating retail locations to watch real buying behavior.'},
{q:'Controlled-Distribution Scanner Markets (CDSMs)',a:'A highly technical testing method linking household buyer panels, targeted cable ad intervention, and retail checkout scanners.'},
{q:'Test Marketing / Full-Scale Test Market',a:'Launching a new product with a complete marketing campaign across a few representative cities to monitor real sales performance.'},
{q:'Launch Management System',a:'A structured monitoring framework used to track market performance, flag unexpected deviations, and execute backup plans.'},
{q:'Gap Analysis Matrix',a:'An evaluation framework used post-launch to compare actual market performance against the plan across windows, alignment, and readiness.'},
{q:'Contingency Plan',a:'A pre-engineered backup business strategy put into action when a tracking variable hits a negative trigger point.'},
{q:'Tracking Variables',a:'Key performance metrics—such as actual trial rates, retail stock percentages, and customer satisfaction scores—monitored daily post-launch.'},
{q:'Trigger Points',a:'Explicit, pre-determined performance thresholds that automatically launch a specific contingency plan if missed.'},
{q:'Innovation Dashboard Categories (Input, Process, Performance Metrics)',a:'A metrics scorecard tracking resources, pipeline velocity, and commercial market outcomes. e'},
{q:'After-Action Review / Post-Launch Audit',a:'A formal organizational meeting held months after a launch to evaluate project successes, failures, and operational lessons for future innovation cycles.'},
{q:'Rollout',a:'A gradual launch method where a product is introduced across sequential geographic zones, corporate regions, or distinct application segments rather than everywhere at once.'},
{q:'Geographic Rollout',a:'Launching a product in one specific region (e.g., the Midwest) to stabilize operations and supply chains before expanding nationwide.'},
{q:'Application Rollout',a:'Launching a product within one specific industry or use case first before introducing it to broader, secondary markets.'},
{q:'Product Deletion Process',a:'A structured corporate exit sequence used to identify, analyze, and systematically delete an underperforming product line.'},
{q:'Consolidation Strategies',a:'An alternative exit path where an unviable product line or its unique patents/brands are packaged and sold off.'},
{q:'Public Policy / Product Liability',a:'The legal and ethical framework governing corporate responsibility for product safety, environmental impacts, and societal welfare.'},
{q:'Sources of Product Liability Injury',a:'Common origin paths for product lawsuits including inherent risks, design defects, manufacturing defects, warning omissions, or after-use hazards.'},
{q:'Strict Liability',a:'A legal doctrine making a manufacturer liable for any injury caused by a defective product, regardless of whether the firm acted with negligence or bad intent.'},
{q:'Product Recall',a:'The active process of retrieving defective, hazardous, or non-compliant goods from consumers and distribution channels.'},
{q:'Sustainable / Green Marketing',a:'Designing and promoting new products using ecologically safe materials and low-emission production techniques to minimize long-term environmental degradation.'},
{q:'Embracers',a:'Forward-thinking companies that integrate eco-sustainability directly into their core business plans as a standard engine of competitive edge.'},
{q:'Triple-Bottom-Line',a:'A corporate tracking philosophy prioritizing three distinct objectives concurrently: financial gains, customer satisfaction, and active societal value.'},
{q:'Eco-Innovation Strategies',a:'Systemic development tracks involving life-cycle design, bio-materials, protective technologies, or access-based models.'},
{q:'Product Piracy Forms',a:'Intellectual property issues ranging from counterfeiting and brand piracy to near-brand usage and illegal copying. e'},
{q:'Frugal Innovation / Gandhian Engineering',a:'A design methodology focused on building highly affordable products that hit acceptable performance thresholds using minimal raw assets.'},
{q:'TRIZ',a:'A structured, rule-based problem-solving methodology rooted in science and patent analysis, translating to the "Theory of Inventive Problem Solving."'},
{q:'Psychological Inertia',a:'The strong mental habits, conventional assumptions, and familiar ways of thinking that prevent engineers from seeing new, unconventional solution spaces.'},
{q:'Ideality',a:'Described as the "Golden Rule of TRIZ," it is the philosophy that every engineering system should naturally maximize useful benefits while completely minimizing costs and harmful effects.'},
{q:'Ideality Equation',a:'A mathematical relationship expressing that Ideality equals Total Benefits divided by the sum of all Costs and Harms ($\\text{Ideality} = \\frac{\\text{Benefits}}{\\text{Costs} + \\text{Harms}}$).'},
{q:'Ideal Outcome / Ideal Solution / Ideal System',a:'The theoretical perfect state of a system where it delivers all desired functions and benefits without consuming any resources, incurring costs, or creating harmful side effects.'},
{q:'Ideal Resources',a:'Existing, free, or underutilized elements already present within or immediately surrounding a system that can be leveraged to solve a problem.'},
{q:'Problem Modeling',a:'The process of converting a highly complex, detailed engineering situation into a simplified abstract model focused strictly on the exact location, time, function, or contradiction causing the issue.'},
{q:'40 Inventive Principles',a:'A library of forty generalized conceptual solution categories derived from global patent analysis used as thinking triggers to resolve engineering contradictions.'},
{q:'Contradiction Matrix',a:'A $39 \\times 39$ structural grid used to cross-reference an engineering parameter being improved against a parameter that is degrading to find recommended Inventive'},
{q:'Principles. 8 Trends of Technical Evolution',a:'A TRIZ framework outlining the predictable evolutionary paths and structural stages technologies naturally progress through over time, used to forecast next-generation products.'},
{q:'Scientific and Engineering Effects Database',a:'A comprehensive, categorized library of physical, chemical, and mathematical phenomena organized so engineers can look up functional solutions without specialized field knowledge.'},
{q:'Thinking in Time and Scale (The Nine Boxes Method)',a:'A visual framework that prompts engineers to analyze a problem across three temporal states (Past, Present, Future) and three structural levels (Super-system, System, Sub-system).'},
{q:'Resources and Trimming',a:'An engineering method focused on identifying available assets inside a system to systematically eliminate (trim) unnecessary components while forcing remaining parts to absorb their functions.'},
{q:'Function Analysis',a:'The structural study of all behaviors and interactions among individual system elements to map what adds value and what causes harm.'},
{q:'Substance-Field Analysis (Su-Field Modeling)',a:'A modeling technique that uses symbols to map the interactions between substances (objects) and fields (energy forces) to isolate system vulnerabilities.'},
{q:'76 Standard Solutions',a:'A structured library of established engineering approaches designed to resolve common, recurring types of technical system failures.'},
{q:'TRIZ Toolkit Chart',a:'A matrix mapping specific TRIZ tools directly to the distinct business and engineering benefits they provide (e.g., cost reduction, forecasting, team coordination).'},
{q:'TRIZ Creativity Triggers',a:'Thirteen simple thinking prompts (including Defining the Ideal Outcome, Imagining an Unknown X-Factor, and Creating a Bad Solution Park) that complement the analytical components of TRIZ to break psychological inertia.'},
{q:'Smart Little People (SLP)',a:'An imaginative technique where components, fluids, or forces are modeled as groups of tiny, intelligent humans to visualize hidden microscopic physical interactions and overcome cognitive barriers.'},
{q:'Size-Time-Cost (STC)',a:'An exaggeration technique where engineers stretch a system to extreme mental boundaries—making it infinitely large/small, infinitely fast/slow, or infinitely expensive/free—to break psychological inertia.'},
{q:'Contradiction',a:'A fundamental clash between two desirable engineering requirements or structural solutions where achieving one automatically compromises the other.'},
{q:'Optimization / Compromise',a:'The traditional engineering approach of moving along a standard performance curve, balancing trade-offs so that a design is "good enough" without truly eliminating the underlying conflict.'},
{q:'Line of Compromise',a:'The performance curve in conventional design where improving parameter $A$ forces an inevitable, mathematical drop in parameter $B$. "Good-Good" Corner: The ultimate goal of TRIZ—leaving the compromise curve entirely to enter a design space where both conflicting requirements are fully realized simultaneously.'},
{q:'Abstraction',a:'The systematic process of temporarily ignoring secondary complications and real-world constraints to simplify a dense problem down to one core contradiction.'},
{q:'Technical Contradiction',a:'A clash where improving one distinct parameter of a system (the "something good") directly causes a completely different parameter to degrade (the "something bad").'},
{q:'Physical Contradiction',a:'A clash occurring when a single parameter or component is required to simultaneously possess completely opposite physical values (e.g., being both hot and cold, large and small, present and absent).'},
{q:'Separation Strategies',a:'The core methodology for solving Physical Contradictions by ensuring opposite requirements do not conflict directly.'},
{q:'Separation in Time',a:'Allowing a system to exhibit a property at one specific moment and the opposite property at a different time (e.g., an airbag appearing only during a crash).'},
{q:'Separation in Space',a:'Allowing opposite properties to exist simultaneously but in completely different physical locations (e.g., a coffee cup being hot inside but cool on the outside).'},
{q:'Separation in Condition / Relation',a:'Allowing a system to change its state or characteristics based on varying operational states or external environments (e.g., a substance fluid while moving but thick when still).'},
{q:'Separation in Scale',a:'Allowing a property to look one way at a macro level but completely opposite at a micro level (e.g., the polar bear’s transparent fur scattering light to look white while its skin is black).'},
{q:'39 Technical Parameters',a:'The universal engineering vocabulary comprising 39 standard metrics (including weight, area, speed, reliability, device complexity, loss of time, and harmful effects) used to systematically define any Technical Contradiction in the Contradiction Matrix.'}];
let i=0;
function show(){q.textContent=flashcards[i].q;a.textContent=flashcards[i].a;c.textContent=`Card ${i+1} of ${flashcards.length}`;card.classList.remove('flip');prev.disabled=i===0;next.disabled=i===flashcards.length-1;}
card.onclick=()=>card.classList.toggle('flip');
function nextCard(){if(i<flashcards.length-1){i++;show();}}
function prevCard(){if(i>0){i--;show();}}
show();
</script></body></html>
