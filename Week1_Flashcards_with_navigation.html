<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>
body{font-family:system-ui;background:#f2f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.wrap{width:min(420px,95vw);text-align:center}
.card{height:260px;perspective:1000px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:16px;backface-visibility:hidden;color:#fff;font-size:1.2rem}
.front{background:#4caf50} .back{background:#2196f3;transform:rotateY(180deg)}
button{margin-top:15px;padding:10px 18px}</style></head><body><div class=wrap><div id=card class=card><div class=inner><div id=q class='face front'></div><div id=a class='face back'></div></div></div><div><button id='prevBtn' onclick='prevCard()'>Previous</button> <button id='nextBtn' onclick='nextCard()'>Next</button></div><div id=c></div></div><script>const flashcards = [
{q:'Tangible Good', a:'A physical object developed for sale, such as a laptop or a vacuum cleaner.'},
{q:'Intangible Service', a:'A non-physical product offering built around user experience, such as online banking or streaming media.'},
{q:'Business-to-Consumer (B2C) Markets', a:'A marketplace where firms sell products directly to individual end consumers for personal use.'},
{q:'Business-to-Business (B2B) Markets', a:'A marketplace where firms sell products to other businesses to support their corporate operations.'},
{q:'Product Innovation Management / Product Planning', a:'Functional names highlighting the strategic and structural innovation decisions involved before product development begins.'},
{q:'Research and Development (R&D)', a:'An engineering-oriented focus on creating new technologies and refining existing ones.'},
{q:'New Products Management', a:'An all-encompassing operational term capturing the reality that successful innovation requires cross-functional collaboration rather than one isolated department.'},
{q:'Innovation', a:'The active introduction of something new that intentionally generates corporate or customer value.'},
{q:'Incremental Innovation', a:'Relatively minor or small improvements made to existing products to build upon what customers already understand while reducing risk.'},
{q:'Radical Innovation', a:'Breakthrough innovations that fundamentally alter markets, replace older technologies, or create entirely new product categories.'},
{q:'Failure Rate', a:'The percentage of new products that fail in the market; research places the average at approximately forty percent rather than the rumored ninety percent.'},
{q:'Ready-Fire-Aim Approach', a:'A problematic organizational style where a company rushes a product into development or market launch before doing sufficient research and planning.'},
{q:'Scope Creep', a:'The constant expansion, change, or modification of project goals and specifications after product development has already begun.'},
{q:'Product Development and Management Association (PDMA)', a:'A professional body whose research compares top-performing companies with average firms.'},
{q:'Screening', a:'The specific process of evaluating product ideas early in the cycle to eliminate low-potential projects before significant resources are spent.'},
{q:'Market Research', a:'Structurally gathering information regarding customer needs, competitor behaviors, and market trends before development decisions are finalized.'},
{q:'Concept Testing', a:'Direct testing where target customers evaluate a product idea before expensive development begins.'},
{q:'Portfolio Analysis', a:'A strategic exercise determining how corporate resources are distributed across multiple development projects.'},
{q:'Open Innovation', a:'A strategic philosophy encouraging organizations to source ideas, expertise, and technologies from both inside and outside the company. e'},
{q:'Cross-Functional Team', a:'A collaborative group containing experts from multiple business disciplines (marketing, engineering, manufacturing, finance) working together throughout development.'},
{q:'Globalization', a:'The growing operational integration of consumer markets, businesses, and development resources across international borders.'},
{q:'Standardized Product', a:'A globalized product design that remains identical worldwide to compress manufacturing costs and preserve a single brand image.'},
{q:'Adapted Product', a:'A global product design modified to directly align with the local preferences, legal regulations, or cultural expectations of individual countries.'},
{q:'Organizational Culture', a:'Shared core values, behavioral expectations, and beliefs influencing how employees think and behave.'},
{q:'Global Innovation Culture', a:'An organizational culture encouraging international collaboration, cross-border knowledge exchange, and treating foreign subsidiaries as distinct sources of innovation.'},
{q:'Opportunity Identification and Selection', a:'The first element of the NPD framework, focusing on recognizing promising technical or market directions to see if they warrant investment.'},
{q:'New Products Process', a:'A structured sequence of functional activities guiding a product from its initial identification phase to launch and commercialization.'},
{q:'Product Innovation Charter (PIC)', a:'A foundational document specifying where a firm intends to innovate, targeted technologies/markets, and overarching project goals.'},
{q:'Product Portfolio Management', a:'A dynamic evaluation method treating all development projects as a collective group to balance risk, strategic alignment, and returns.'},
{q:'Product Team', a:'The cross-functional group directly responsible for translating an approved product concept into a physical or digital reality.'},
{q:'Opportunity', a:'A favorable business situation where customer needs, market changes, or new technological capabilities show potential for value creation.'},
{q:'Ongoing Marketing Planning', a:'Continuous monitoring of active customer behaviors, competitor developments, and structural market trends.'},
{q:'Ongoing Corporate Planning', a:'The active process where senior management outlines long-term corporate business growth objectives.'},
{q:'Special Opportunity Analysis', a:"Internal auditing of a company's unique resources, technologies, and core competencies to leverage underutilized assets."},
{q:'Underutilized Resource', a:'An operational opportunity where a firm possesses internal capabilities that are not being fully exploited.'},
{q:'New Resource', a:'An innovation opportunity emerging directly from a new technological discovery or technical breakthrough.'},
{q:'External Mandate', a:'Opportunities driven from outside the firm, such as regulatory changes, competitive market threats, or evolving consumer tastes.'},
{q:'Internal Mandate', a:'Opportunities originating from inside the firm, usually when senior leadership issues long-term strategic growth goals. e'},
{q:'Concept Generation', a:'The second phase of the new products process, focusing on developing explicit product concepts to fulfill an identified opportunity.'},
{q:'Product Concept', a:'A clear, detailed description of a potential product outlining its form, technology, and customer benefits.'},
{q:'Problem-Find, Problem-Solve Method', a:'A customer-centric approach that uncovers common consumer frustrations first before designing technical solutions.'},
{q:'Concept and Project Evaluation', a:'The third phase of the process, filtering out weak concepts before major resources are committed.'},
{q:'Fuzzy Front End (FFE)', a:'The early phases of product development (identification, generation, evaluation) characterized by high ambiguity and limited information.'},
{q:'Development', a:'The fourth stage of the process, where ideas are turned into physical/digital products, marketing strategies, and financial plans.'},
{q:'Prototype', a:'An early, physical or digital version of a product constructed to test technical parameters and gather customer feedback.'},
{q:'Resource Preparation', a:'Training workers, altering operational guidelines, or buying equipment to build capabilities for a new product.'},
{q:'Launch', a:'The final stage of the process, introducing the finished product into the marketplace through scaled manufacturing and promotion.'},
{q:'Commercialization', a:'Turning a developed concept into a market reality by launching full-scale manufacturing, sales, and distribution channels.'},
{q:'Corporate Strategy', a:"Defining a firm's long-term business vision, asset allocation, and competitive positioning across its markets."},
{q:'Product Innovation Strategy', a:'Translating broad corporate goals into operational innovation guidelines and project objectives.'},
{q:'Background (PIC Component)', a:"Outlining a firm's current industry situation, resource constraints, technological competencies, and environment."},
{q:'Focus (PIC Component)', a:'Specifying the exact technologies, product lines, or customer markets an innovation project must target or avoid.'},
{q:'Goals and Objectives (PIC Component)', a:'Establishing the general outcomes and measurable success milestones for innovation projects.'},
{q:'Arena', a:'The distinct industries, customer domains, or technical platforms chosen for strategic focus.'},
{q:'Strategic Fit', a:"How well a proposed new project aligns with a firm's existing resources, competencies, and long-term vision."},
{q:'Product Platform', a:'A shared technological foundation or design architecture used to efficiently build a family of related products.'},
{q:'Platform Planning', a:'Planning collections of products using shared manufacturing parameters or design pieces.'},
{q:'Derivative Products', a:'Secondary product offerings built directly onto an existing product platform with minor variations.'},
{q:'Core Competencies', a:'A firm’s unique combination of institutional knowledge, internal skills, and technical assets that competitors cannot easily copy. e'},
{q:'Technology Push', a:'An innovation dynamic starting with a new technical capability that engineers seek to commercialize.'},
{q:'Market Pull', a:'An innovation dynamic driven by an identified, unmet market need that a firm designs technology to solve.'},
{q:'Preparation', a:'Structuring an organization’s creative environments, personnel, and strategic goals before ideation starts.'},
{q:'Ideation', a:'The collective practice of generating new product ideas.'},
{q:'Creativity', a:'An individual’s unique cognitive ability to generate original and functionally useful ideas.'},
{q:'Genius Thinking Strategies', a:'Specific thinking patterns used by highly creative individuals, such as mapping thoughts visually or looking at opposites.'},
{q:'Groupthink', a:'A cultural dynamic where team members conform to ideas everyone finds acceptable, suppressing original concepts.'},
{q:'Targeting Error', a:'Repeatedly focusing ideation on the same customer groups while missing emerging target segments.'},
{q:'Poor Customer Knowledge', a:'Relying on basic market research metrics without truly understanding real customer behavior.'},
{q:'Complexity (Obstacle)', a:'Complicating a product idea instead of prioritizing the simplicity that customers prefer.'},
{q:'Lack of Empathy', a:'A barrier occurring when managers differ significantly from average customers in education, income, or lifestyle.'},
{q:'Too Many Cooks', a:'Internal political rivalries and corporate friction that stall or kill early product ideas.'},
{q:'Deep Dive Approach', a:'A rapid, iterative ideation method using field research, heavy brainstorming, prototyping, and user testing.'},
{q:'Idea Banks', a:'Centralized corporate databases storing historical concepts, past research, and failed project notes for future use.'},
{q:'Innovation Centers', a:'Specialized data hubs that analyze customer trends to shorten development timelines.'},
{q:'Itemized Response', a:"A communication technique where feedback must first highlight an idea's strengths before suggesting improvements."},
{q:'Creative Abrasion', a:'Intentionally mixing individuals with different viewpoints to create healthy, productive debate.'},
{q:'Barriers to Group Creativity', a:'Issues like low cross-functional diversity, excessive departmental loyalty, or social cohesion that stops disagreement. e'},
{q:'Form', a:'The concrete physical appearance, dimensions, or behavioral steps of a product or service.'},
{q:'Technology', a:"The source of engineering or scientific knowledge applied to create a product's form."},
{q:'Need/Benefit', a:'The specific consumer problem solved or utility delivered by an item.'},
{q:'Product Concept Statement', a:'A value claim describing form, technology, or benefits so customers and engineers can evaluate it.'},
{q:'User Toolkits', a:'Interactive design tools provided to customers so they can configure, build, or customize their own products.'},
{q:'Mass Customization / Product Configurators', a:"Digital interfaces allowing buyers to personalize a product's features while revealing market preferences."},
{q:'Crowdsourcing', a:'Sourcing new ideas or solutions from a large, open audience of consumers via online channels.'},
{q:'Wisdom of Crowds', a:'The collective intelligence of a large group, used to discover standout ideas.'},
{q:'Lead Users', a:'Advanced consumers who experience needs months or years before the general market and often build their own solutions.'},
{q:'Inbound Open Innovation', a:'Sourcing and adopting external technologies, intellectual property, or expertise from outside partners.'},
{q:'Outbound Open Innovation', a:'Licensing out, selling off, or commercializing internally developed technologies to external firms.'},
{q:'Problem-Based Concept Generation', a:'Creating new product concepts by first isolating and studying customer frustrations.'},
{q:'Problem Analysis', a:'Systematically exploring user issues with existing products or activities.'},
{q:'Reverse Brainstorming', a:'Asking participants what can go wrong or what they dislike about a product to find weaknesses.'},
{q:'Heavy Users', a:"Highly experienced product users who are deeply aware of a product's flaws."},
{q:'Severity', a:'A metric measuring how disruptive or serious a product problem is when it occurs.'},
{q:'Frequency', a:'A metric measuring how often a customer encounters a specific product issue.'},
{q:'Bothersomeness Index', a:'A ranking tool that evaluates problems by combining severity, frequency, and whether customers already have a solution.'},
{q:'Stakeholder Contacts', a:'Sourcing direct user feedback through target interviews, service records, and focus groups.'},
{q:'Voice of the Customer (VOC)', a:"A collection of customer needs and desires, described in the customer's own language."},
{q:'Focus Groups', a:'Guided discussions with a selected group of consumers to uncover shared frustrations and ideas. e'},
{q:'Latent / Hidden Needs', a:'Subtle customer needs that consumers experience but cannot clearly articulate.'},
{q:'Online Community', a:'Electronic communication platforms where dispersed users share experiences, reviews, and ideas.'},
{q:'Disciplines Panel', a:'A cross-functional group of internal experts assembled to review a problem from multiple operational angles.'},
{q:'Analytical Attribute Approaches', a:'Systematically identifying innovation opportunities by studying and altering product characteristics.'},
{q:'Product Attribute', a:'Any descriptive feature, function, or benefit associated with a product.'},
{q:'Features', a:'What a product consists of, including its physical parts, materials, sizes, and designs.'},
{q:'Functions', a:'What a product actively does and how it runs to fulfill its primary task.'},
{q:'Benefits', a:'The distinct personal value or functional utility a buyer receives from using an item.'},
{q:'Perceptual Gap Analysis', a:'A quantitative method identifying areas in the market where no competing products exist.'},
{q:'Determinant Attributes', a:'Product dimensions that are highly important to buyers and differentiate competing brands.'},
{q:'Determinant Gap Maps', a:'Market positioning maps built using dimensions chosen by managers.'},
{q:'Perceptual Gap Map', a:'Positioning maps built using consumer survey data rather than manager opinions.'},
{q:'Factor Analysis', a:'A statistical tool that condenses many product attributes into a smaller number of underlying dimensions.'},
{q:'Trade-Off / Conjoint Analysis', a:'A quantitative method estimating how consumers value different combinations of product attributes.'},
{q:'Full-Profile Conjoint Analysis', a:'A survey type where respondents evaluate complete, highly detailed product options.'},
{q:'Adaptive Conjoint Analysis', a:"A survey that adjusts subsequent choices based on a respondent's earlier answers."},
{q:'Choice-Based Conjoint Analysis', a:'Conjoint testing where buyers select which product profile they would actually buy from a competitive set.'},
{q:'Dimensional Analysis', a:'A qualitative tool listing every single physical attribute of an item to brainstorm modifications.'},
{q:'Checklist Method', a:"Standardized lists of questions used to spark ideas by prompting changes to a product's size, shape, or color."},
{q:'Creativity Templates', a:'Patterned transformation steps systematically applied to an existing item to create a new design.'},
{q:'Attribute Dependency Template', a:'Linking two independent product variables so that one automatically changes when the other does.'},
{q:'Replacement Template', a:'Removing an internal product part and replacing it with a component from an outside environment.'},
{q:'Displacement Template', a:'Complete removal of a product component and its associated function to alter the product or lower costs.'},
{q:'Component Control Template', a:'Creating a functional link between an internal product component and an outside environmental element.'},
{q:'Analogy', a:'Looking outside a firm’s current industry to see how similar problems were solved in different fields.'},
{q:'Value Curve Creation Approach', a:"Reshaping a product's profile by raising, reducing, eliminating, or creating attributes to boost value."},
{q:'UNFISS Framework', a:'A structured evaluation model judging concepts across six dimensions: Uniqueness, Need fulfillment, Feasibility, Impact, Scalability, and Strategic fit.'},
{q:'Cumulative Expenditures Curve', a:'A graph showing how project costs accumulate over time; curves vary by industry.'},
{q:'Risk/Payoff Matrix', a:'A framework mapping project choices against actual success/failure outcomes.'},
{q:'Drop Error', a:'An evaluation mistake where a company kills a product concept that would have been highly successful.'},
{q:'Go Error', a:'An evaluation mistake where a company greenlights a poor concept, wasting development resources.'},
{q:'Risk Strategies', a:'Generic approaches to managing project risk: Avoidance, Mitigation, Transfer, or Acceptance.'},
{q:'Decay Curve', a:'A curve showing how hundreds of original concepts are gradually filtered down to a few final launches.'},
{q:'Rolling Evaluation', a:'Continually updating project assumptions, financials, and feedback as new data emerges.'},
{q:'Surrogate Questions', a:'Substitute questions used to infer insights when exact data cannot yet be measured directly.'},
{q:'A-T-A-R Model', a:'A forecasting model estimating long-run market share and profit based on Awareness, Trial, Availability, and Repeat purchase. e'},
{q:'All Commodity Volume (ACV)', a:"A metric estimating retail distribution coverage to measure a product's market availability."},
{q:'Prototype Concept Testing', a:'Presenting a physical prototype to users rather than a text description to get more realistic feedback.'},
{q:'Likert Scale (Purchase Intention)', a:"A graded questionnaire scale measuring a consumer's likelihood to buy a product."},
{q:'Top-Two-Boxes Score', a:'Combining the top two positive response categories ("definitely would buy" and "probably would buy").'},
{q:'Commercialized Concept Statement', a:'A product concept description styled like an ad, using persuasive marketing language.'},
{q:'Noncommercialized Concept Statement (Stripped Description)', a:'A neutral product description presenting only objective technical facts.'}
];
let i=0;function show(){q.textContent=flashcards[i].q;a.textContent=flashcards[i].a;c.textContent=`Card ${i+1} of ${flashcards.length}`;card.classList.remove('flip');prevBtn.disabled=i===0;nextBtn.disabled=i===flashcards.length-1}
card.onclick=()=>card.classList.toggle('flip');
function nextCard(){if(i<flashcards.length-1){i++;show();}}
function prevCard(){if(i>0){i--;show();}}
show();</script></body></html>
