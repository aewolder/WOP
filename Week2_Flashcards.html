<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>
body{font-family:system-ui;background:#f2f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.wrap{width:min(420px,95vw);text-align:center}.card{height:260px;perspective:1000px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:16px;backface-visibility:hidden;color:#fff;font-size:1.2rem}
.front{background:#4caf50}.back{background:#2196f3;transform:rotateY(180deg)}button{margin:10px;padding:10px 18px}</style></head>
<body><div class=wrap><div id=card class=card><div class=inner><div id=q class='face front'></div><div id=a class='face back'></div></div></div>
<div><button id=prev onclick='prevCard()'>Previous</button><button id=next onclick='nextCard()'>Next</button></div><div id=c></div></div>
<script>
const flashcards=[{q:'Benefit Map',a:'A visual display mapping different benefit segments within a target marketplace.'},
{q:'Joint Space Map',a:'A positioning map combining customer segment preferences and existing products to spot market opportunities.'},
{q:'Full Screen',a:'A comprehensive evaluation stage occurring after concept testing to decide which concepts enter technical development.'},
{q:'Scoring Model',a:'A structured decision tool that rates concepts against explicit criteria to guide project choices.'},
{q:'Technical Accomplishment',a:'Factors tracking whether a firm can successfully design, engineer, and build a product.'},
{q:'Commercial Accomplishment',a:'Factors tracking whether a firm can sell a product and meet financial or market goals.'},
{q:'Net Present Value (NPV)',a:'The discounted value of all future project cash flows after accounting for development costs.'},
{q:'Industrial Research Institute (IRI) Scoring Model',a:'A model designed to check technical and commercial risks for R&D projects.'},
{q:'Proprietary Position',a:"The strength of a project's patent protection and defensible intellectual property."},
{q:'Olympic Averaging / Olympic Figure-Skating Method',a:'Combining evaluator scores by throwing out the highest and lowest ratings before averaging.'},
{q:'Culling Factors',a:'Must-pass criteria that automatically kill a project if it fails, regardless of its other scores.'},
{q:'Sensitivity Testing',a:'Changing model weights or input scores to see if the final project rankings shift.'},
{q:'Profile Sheet',a:"A visual sheet plotting average factor scores to quickly highlight a concept's strengths and weaknesses."},
{q:'Analytic Hierarchy Process (AHP)',a:'A decision-making tool using a tree hierarchy and pairwise comparisons to rank projects. e'},
{q:'Hierarchical Decision Tree',a:'A multi-layered structure mapping overarching goals, primary criteria, and secondary metrics.'},
{q:'Pairwise Comparisons',a:'Rating the importance of evaluation criteria or project options by comparing them in pairs.'},
{q:'Global Weights',a:'Final priority values calculated via AHP software to rank development options.'},
{q:'Cutoff Scores',a:'The minimum acceptable score a project must earn to stay in the development pipeline.'},
{q:'Sales Forecasting',a:'Generating informed demand estimates to guide manufacturing, marketing, and investment choices.'},
{q:'Market Potential',a:'The maximum possible sales volume available to all firms in an industry under peak marketing support.'},
{q:'What-If Analysis',a:'Simulating alternative scenarios by changing forecast inputs to check the impact of uncertainty.'},
{q:'Diffusion of Innovation',a:'The social process describing how an innovation spreads through a population over time.'},
{q:'Adopter Categories',a:'Five consumer groups defined by when they adopt a product: Innovators, Early Adopters, Early Majority, Late Majority, and Laggards.'},
{q:'Analogous Products',a:"Using a past product's sales curve as a benchmark to forecast a new, similar innovation."},
{q:'Bass Diffusion Model',a:'A math model forecasting adoption over time based on innovation effects ($p$) and imitation effects ($q$).'},
{q:'Product Life Cycle',a:'Stages a product goes through over time, mapping the timing of R&D costs, revenues, and profits.'},
{q:'Real Options Analysis',a:'An investment framework treating development as a step-by-step sequence of choices to preserve flexibility.'},
{q:'Strategic Portfolio Management',a:'Allocating funds via a Top-Down Approach (strategy drives funding) or a Bottom-Up Approach (project criteria drive selection).'},
{q:'Product Protocol (Product Requirements/Deliverables)',a:"A formal cross-departmental document defining a product's performance targets and deliverables before engineering begins."},
{q:'Quality Function Deployment (QFD)',a:'A process that translates customer needs into concrete engineering parameters.'},
{q:'Target Market',a:'The specific customer group or market segment a product is designed to serve.'},
{q:'Product Positioning',a:'How a firm wants its new product to be perceived by consumers relative to competing items.'},
{q:'Competitive Comparison / Benchmarking',a:"Directly measuring a proposed product's features against its top competitors."},
{q:'Three Levels of a Product / Augmentation Dimension',a:'Segmenting a product into its Core Benefit, Formal Product, and Augmentations.'},
{q:'Project Timing / Milestones',a:'Deadlines and check-ins used to track project speed.'},
{q:'Operational Requirements',a:'Corporate constraints tracking required production volumes, costs, and quality standards.'},
{q:'Potential Potholes',a:'Foreseeable risks or technical challenges that could derail a project if ignored early on.'},
{q:'Obeya (Oobeya) Room',a:'A dedicated cross-functional war room where team members co-locate to visually track progress and solve problems quickly.'},
{q:'Wildcatting',a:'Betting on or investing heavily in an unproven technology with high risk but massive potential rewards.'},
{q:'Design',a:'Synthesizing technology and human needs into functional, high-quality, and manufacturable products.'},
{q:'Styling',a:"A design focus centered primarily on a product's outward appearance."},
{q:"Dieter Rams' Principles for Good Product Design",a:'Ten benchmarks stating design must be innovative, aesthetic, unobtrusive, honest, long-lasting, thorough, environmentally friendly, understandable, useful, and minimalist.'},
{q:'Design-Driven Innovation',a:'An approach where designers create entirely new meanings and experiences for customers, carving out new markets.'},
{q:'Technology-Driven Innovation',a:'An approach where technical breakthroughs are engineered first, and designers later adapt the shell.'},
{q:'User-Oriented Design',a:'Incorporating the Voice of the Customer and user feedback directly into the design process.'},
{q:'Universal Design',a:'Intentionally designing items to be accessible and useful for individuals of all ages and physical abilities.'},
{q:'Seven Principles of Universal Design',a:'Rules stating design must be equitable, flexible, simple/intuitive, perceptible, error-tolerant, low-effort, and appropriately sized.'},
{q:'Visual Equity',a:'Designing products with consistent visual cues to reinforce corporate identity and brand image.'},
{q:'Design for the Environment',a:"Minimizing environmental impact across a product's entire life cycle."},
{q:'Design for Disassembly',a:'Engineering items so they can be easily taken apart at the end of their life for recycling.'},
{q:'Green Design',a:'Embedding environmental sustainability directly into materials choice and factory production.'},
{q:'Ergonomics',a:'Studying human traits to build products that are safe, comfortable, and easy to operate.'},
{q:'Product Architecture',a:"Organizing a product's components and functional elements into a structured physical layout."},
{q:'Components',a:'The individual physical parts that make up a product.'},
{q:'Functional Elements',a:'What individual parts of a product accomplish.'},
{q:'Chunks / Modules',a:'Logical groupings of related product parts that interact through defined interfaces.'},
{q:'Four-Step Process for Product Architecture',a:'Systematic design steps: Create Schematic, Cluster Elements, Create'},
{q:'Layout, and Check Interactions. Assessment Factors for Industrial Design',a:'Industrial design metrics tracking user interface quality, emotional appeal, maintenance ease, resource use, and product differentiation.'},
{q:'Comprehensive Prototype',a:'A complete, high-fidelity model that looks and runs like the final product to check the entire system.'},
{q:'Focused Prototype',a:'A low-fidelity model built to test a specific performance attribute or shape.'},
{q:'Probe-and-Learn Development',a:'Iterative prototyping used to test parameters and tefine assumptions before full production.'},
{q:'Product-Use Testing',a:'Letting real users test a physical prototype under normal, everyday conditions.'},
{q:'Envelope Design',a:'Managing all customer experiences before and after purchase, like warranties and customer service.'},
{q:'Colocation',a:'Physically seating cross-functional team members together to speed up communication and cut down delays.'},
{q:'Digital Colocation',a:'Using digital collaboration software to connect remote team members.'},
{q:'Produceability Engineers',a:'Specialists who bridge design and manufacturing to ensure parts can be built efficiently.'},
{q:'Supplier Integration',a:'Bringing key component suppliers into early team discussions to improve design quality.'},
{q:'CAD / CAM / CAE',a:'Digital tools used to design products, run engineering simulations, and manage factory machinery.'},
{q:'Design for Manufacturability (DFM)',a:'Designing products to minimize production costs, since most costs are locked in early.'},
{q:'Front-Loading',a:'Spotting and fixing design flaws early in the process when changes are cheaper.'},
{q:'Design for Assembly (DFA)',a:"Changing a product's design to reduce part counts and simplify assembly line steps."},
{q:'Additive Manufacturing (AM) / 3D Printing',a:'Building items layer-by-layer from digital models to enable fast customization and reduce parts.'},
{q:'Interaction Design',a:'Structuring how users naturally interact with a product to make usage simple and seamless. e'},
{q:"Peter Drucker's Sports Team Analogies",a:'Comparing teams to Baseball (independent steps), Football (parallel work), or Tennis Doubles (continuous collaboration).'},
{q:'Projectization',a:'How much team members are committed to a project versus their home functional departments.'},
{q:'Lightweight Teams',a:'A project structure with low projectization; employees stay loyal to their functional departments.'},
{q:'Heavyweight Teams',a:'A project structure with high projectization; the project manager has major authority.'},
{q:'Functional Structure',a:'Development tasks remain entirely inside departments; projects are run by committees.'},
{q:'Project Structure',a:'Workers leave their home departments to work full-time under a project manager.'},
{q:'Matrix Structure',a:'Balancing departmental ties and project needs via a Functional, Balanced, or Project Matrix.'},
{q:'Role Conflict',a:'Friction employees face when torn between department priorities and project goals.'},
{q:'Venture Team',a:'A highly projectized team set up independently to incubate breakthrough innovations.'},
{q:'Skunkworks',a:'An isolated innovation group given the autonomy to pursue secret or highly radical projects away from corporate red tape.'},
{q:'Spinout Ventures',a:'Independent businesses set up outside the parent firm to commercialize a new technology.'},
{q:'Three Stages of Radical Innovation',a:'The lifecycle of radical projects: Discovery, Incubation, and Acceleration.'},
{q:'Chief Engineer',a:'A leader who provides technical direction while coordinating experts across departments.'},
{q:'Culture of Collaboration',a:'A workplace culture built on continuous learning, risk tolerance, and clear accountability.'},
{q:'Three Layers of Development Teams',a:'Structuring a project team into a Core Team, Ad Hoc Team, and Extended Team.'},
{q:'Project Champion',a:'An individual who passionately backs a project to secure funding and beat internal resistance.'},
{q:'Specialized Champion Roles',a:'Promoting innovation via Power Promoters, Expert Promoters, Process Promoters, or Relationship Promoters.'},
{q:'Technological Gatekeeper',a:'An employee who gathers, interprets, and shares critical technical data with the team.'},
{q:'Network Building',a:'Mapping innovation connections through Nodes (people/firms), Links (ties), and Operating Relationships.'},
{q:'Charged Behavior',a:'A team state where members are highly energized, enthusiastic, and focused on solving project goals.'},
{q:'Cross-Functional Interface Management',a:'Managing collaboration and easing friction between different departments. e'},
{q:'Five Conflict Management Styles',a:'Approaches to resolving team conflict: Confrontation, Give and Take, Withdrawal, Smoothing, and Forcing.'},
{q:'Barriers to Market Orientation',a:'A problem where isolated departments focus on their own goals rather than user needs.'},
{q:'Virtual Teams',a:'Teams that collaborate online across different locations using digital tools.'},
{q:'Synchronous Communication',a:'Live, real-time collaboration, such as video meetings.'},
{q:'Asynchronous Communication',a:'Delayed collaboration over time, such as using shared documents.'},
{q:'Globally Displaced Teams (GDTs)',a:'Project teams spread across multiple countries to access international expertise and round-the-clock development.'},
{q:'Ramp-Up Phase',a:'The transition period where marketing prepares ads and training, while factories scale up for full production.'},
{q:'Assessing Competitive Reaction',a:'Tracking and predicting how rivals might copy or respond to a new product launch.'},
{q:'Product Use Testing (PUT) / Field Testing',a:'Placing prototype or pre-production items into the hands of real target consumers to use in their normal, everyday environments.'},
{q:'Alpha Testing',a:"Internal product use testing conducted by employees, engineers, and quality assurance personnel within the firm's controlled lab facilities."},
{q:'Beta Testing',a:'External product use testing where a near-final version of the product is given to real customers to determine if it meets operational requirements and handles real-world bugs.'},
{q:'Gamma Testing',a:'An extended, high-intensity product use test where the product is subjected to thorough, long-term testing by users to ensure it completely solves the targeted problem or medical/safety need before launch.'},
{q:'User Risk',a:'The danger that a consumer encounters unexpected safety hazards, performance failures, or operational difficulties when using a new product.'},
{q:'Manufacturer Risk',a:'The corporate danger that a product launch results in expensive recalls, brand damage, or legal liability due to underlying design flaws.'},
{q:'Information Leakage',a:'The strategic risk that providing prototypes to external beta testers allows competitors to discover and copy the product details before launch.'},
{q:'Monadic Testing',a:'A product use test setup where a consumer evaluates only a single product concept or prototype at a time.'},
{q:'Sequential Monadic Testing',a:'A testing style where a customer evaluates one product thoroughly, records their feedback, and is then given a second product to evaluate separately.'},
{q:'Paired Comparison Testing',a:'A product use test where a consumer is given two different products at the same time and asked to compare them directly against each other.'},
{q:'Triangular Comparison Testing',a:'A testing format where a consumer is given three product samples—two identical and one different—and is asked to identify the unique sample and state their preference.'},
{q:'Blind Test',a:'A product use test where all corporate logos, brand names, and distinct packaging elements are removed so consumers evaluate performance without brand bias.'},
{q:'Staged Product Use Testing',a:'A gradual testing process that starts with small internal groups (Alpha) before expanding to larger external customer groups (Beta).'},
{q:'Strategic Launch Planning',a:'The upfront process of defining overarching business goals, target market decisions, product positioning, and structural timing before tactical marketing begins.'},
{q:'Strategic Deliverables / Launch Objectives',a:'Explicit corporate goals defining exactly what the launch must achieve, such as specific market share, gross profit margins, or brand awareness levels.'},
{q:'Strategic Platform Decisions',a:"Fundamental choices regarding how the new product fits into the firm's broader corporate image, product catalog, and market history."},
{q:'Strategic Givens',a:'Fixed constraints established in earlier development stages (through the PIC or product protocol) that provide the boundaries within which launch planning occurs.'},
{q:'Cash-to-Cash Metric / Time-to-Break-Even Metric',a:'A financial measure tracking the exact duration between investing capital into product development and recovering that investment through customer purchases.'},
{q:'Primary Demand',a:'Marketing designed to educate customers about an entirely new product category for a new-to-the-world product.'},
{q:'Selective Demand',a:'Marketing designed to encourage customers to choose a specific brand over existing market alternatives.'},
{q:'Replacement Demand',a:'Marketing focused on persuading current customers to upgrade from older product versions to a newer iteration.'},
{q:'Permanent Stand-Alone Launch',a:"A strategic choice where a product is introduced with the intention of remaining a long-term, permanent addition to the firm's active product catalog."},
{q:'Permanent Substitution Launch',a:'A launch strategy designed to completely replace an existing, older corporate product line with a newer iteration.'},
{q:'Conditional Permanence',a:'A longevity strategy where a product remains on the market indefinitely only if it meets predetermined performance objectives.'},
{q:'Temporary / Bridge Launch',a:'Introducing a temporary product line designed to keep customers engaged or ward off competitors while a long-term technical innovation is being finalized.'},
{q:'Launch Aggressiveness (Aggressive, Cautious, Balanced)',a:'The deliberate resource commitment level chosen for market entry, ranging from immediate massive marketing investment to a gradual, risk-minimizing introduction.'},
{q:'Butt-on Replacement',a:'An immediate substitution strategy where a new product instantly replaces the old one.'},
{q:'Low-season / High-season Replacement',a:'Introducing a replacement offering specifically during periods of either low market demand or peak selling cycles.'},
{q:'Roll-in, Roll-out Replacement',a:'Gradually introducing a new product line across different geographic markets, regions, or trade channels.'},
{q:'Downgrading',a:'Keeping an older product available on the market but with reduced marketing, manufacturing, or service support.'},
{q:'Channel Splitting',a:'Selling older and newer versions of a product line concurrently through entirely separate distribution networks.'},
{q:'Market Segmentation',a:'Dividing a customer base into distinct, scannable groups with similar characteristics so marketing efforts can be concentrated effectively.'},
{q:'End-use Segmentation',a:'Grouping customers according to the specific functional ways they utilize the product.'},
{q:'Geographic Segmentation',a:'Dividing markets based on regional locations, physical climates, and cultural boundaries.'},
{q:'Demographic Segmentation',a:'Classifying customers by measurable socioeconomic variables such as age, gender, income, education, and family structure.'},
{q:'Psychographic Segmentation',a:'Focuses on customer lifestyles, interests, values, and personalities, often mapped via frameworks like VALS.'},
{q:'Benefit Segmentation',a:'Grouping customers according to the specific, distinct benefits they seek from an item rather than who they are.'}];
let i=0;
function show(){q.textContent=flashcards[i].q;a.textContent=flashcards[i].a;c.textContent=`Card ${i+1} of ${flashcards.length}`;card.classList.remove('flip');prev.disabled=i===0;next.disabled=i===flashcards.length-1;}
card.onclick=()=>card.classList.toggle('flip');
function nextCard(){if(i<flashcards.length-1){i++;show();}}
function prevCard(){if(i>0){i--;show();}}
show();
</script></body></html>
