<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1BV00 Fundamentals of business information systems flashcards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: system-ui, Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    max-width: 460px;
    width: 100%;
    text-align: center;
}
.card {
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    padding: 30px 20px;
    font-size: 1.12em;
    cursor: pointer;
    user-select: none;
    min-height: 270px;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1.45;
}

/* Front vs Back colors */
.card.front {
    background: #dbeeff;
}
.card.back {
    background: white;
}

.hint {
    font-size: 0.82em;
    color: #666;
    margin-top: 14px;
}
button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.counter {
    margin-top: 10px;
    font-size: 0.85em;
    color: #555;
}
</style>
</head>
<body>

<div class="container">
    <div class="card front" onclick="flipCard()">
        <div id="card-content"></div>
    </div>

    <button id="backBtn" onclick="prevCard()" style="display:none;">Back</button>
    <button onclick="nextCard()">Next</button>

    <div class="counter" id="counter"></div>
</div>

<script>
// ✅ YOUR FULL ORIGINAL CARD LIST 
const cards = [
    {'term': 'What is social business?', 'definition': 'Use of social networking platforms to engage employees, customers, and suppliers'},
    {'term': 'Name two benefits of social business', 'definition': 'Increased productivity and innovation'},
    {'term': 'What is an intranet?', 'definition': 'A private company network using Internet technology'},
    {'term': 'What is a data warehouse?', 'definition': 'A system storing current and historical data for decision making'},
    {'term': 'What is a data mart?', 'definition': 'A subset of a data warehouse for specific users'},
    {'term': 'What is OLAP?', 'definition': 'Tool for multidimensional data analysis'},
    {'term': 'What is data mining?', 'definition': 'Finding patterns and relationships in large datasets'},
    {'term': 'What is text mining?', 'definition': 'Analyzing unstructured text data'},
    {'term': 'What is an information policy?', 'definition': 'Rules for managing and sharing data'},
    {'term': 'What is the value chain model?', 'definition': 'A model showing activities that add value to products/services'},
    {'term': 'What is benchmarking?', 'definition': 'Comparing performance against standards'},
    {'term': 'What is a value web?', 'definition': 'Network of firms coordinating value chains using IT'},
    {'term': 'What are synergies?', 'definition': 'When outputs of one unit become inputs of another'},
    {'term': 'What is a core competency?', 'definition': 'Activity where a firm is an industry leader'},
    {'term': 'What is network economics?', 'definition': 'Value increases as more users join a network'},
    {'term': 'What is a virtual company?', 'definition': 'Uses networks to collaborate without physical boundaries'},
    {'term': 'What is total quality management (TQM)?', 'definition': 'Organization-wide effort to improve quality'},
    {'term': 'What is Six Sigma?', 'definition': 'Quality standard of 3.4 defects per million opportunities'},
    {'term': 'What is CRM?', 'definition': 'Systems managing customer interactions and data'},
    {'term': 'What is a customer touch point?', 'definition': 'Any interaction with a customer'},
    {'term': 'What is sales force automation?', 'definition': 'Tools to increase sales productivity'},
    {'term': 'What is cross-selling?', 'definition': 'Selling complementary products'},
    {'term': 'What is analytical CRM?', 'definition': 'Analyzing customer data for insights'},
    {'term': 'What is customer lifetime value?', 'definition': 'Total value of a customer over time'},
    {'term': 'What is churn rate?', 'definition': 'Percentage of customers who stop using a service'},
    {'term': 'What is ubiquity in e-commerce?', 'definition': 'Availability everywhere at any time'},
    {'term': 'What is global reach?', 'definition': 'Ability to conduct transactions worldwide'},
    {'term': 'What is information density?', 'definition': 'Increased amount and quality of information'},
    {'term': 'What is personalization?', 'definition': 'Tailoring products/services to individuals'},
    {'term': 'What is information asymmetry?', 'definition': 'One party has more information than another'},
    {'term': 'What are transaction costs?', 'definition': 'Costs of participating in a market'},
    {'term': 'What is disintermediation?', 'definition': 'Removing intermediaries in a value chain'},
    {'term': 'What is B2C e-commerce?', 'definition': 'Businesses selling to consumers'},
    {'term': 'What is B2B e-commerce?', 'definition': 'Businesses selling to other businesses'},
    {'term': 'What is a transaction broker?', 'definition': 'Processes transactions and saves time/money'},
    {'term': 'What is an affiliate revenue model?', 'definition': 'Earning commission by referring customers'},
    {'term': 'What is behavioral targeting?', 'definition': 'Tracking user behavior to show ads'},
    {'term': 'What is m-commerce?', 'definition': 'Buying/selling via mobile devices'},
    {'term': 'What are location-based services?', 'definition': 'Services using geographic data (e.g., maps, nearby places)'},
    {'term': 'What is a structured decision?', 'definition': 'Routine decision with a clear procedure'},
    {'term': 'What is an unstructured decision?', 'definition': 'Decision requiring judgment and insight'},
    {'term': 'What is a semi-structured decision?', 'definition': 'Decision with both clear and unclear elements'},
    {'term': 'What are the stages of decision making?', 'definition': 'Intelligence, design, choice, implementation'},
    {'term': 'What is predictive analytics?', 'definition': 'Using data to forecast future trends'},
    {'term': 'What is an expert system?', 'definition': 'System that mimics human expertise using rules'},
    {'term': 'What is a genetic algorithm?', 'definition': 'Method for finding optimal solutions by testing many options'},
    {'term': 'What is an intelligent agent?', 'definition': 'Software that performs tasks automatically'},
    {'term': 'What is a learning management system (LMS)?', 'definition': 'System for training and education'},    
    {'term': 'Name the five primary activities in the value chain', 'definition': 'Inbound logistics (receiving/storing materials), Operations (transforms inputs), Outbound logistics (storing/distributing), Sales and marketing, Service (maintenance/repair)'},
    {'term': 'Name the four support activities in the value chain', 'definition': 'Administration and management, Human resources, Technology (e.g., CAD), Procurement (purchasing systems)'},
    {'term': 'What does quality mean from the producer’s perspective?', 'definition': 'Conformance to specifications or absence of variation from those specifications'},
    {'term': 'What does quality mean from the customer’s perspective?', 'definition': 'Durability, safety, ease of use, installation, quality of service, psychological aspects'},
    {'term': 'How do information systems improve quality?', 'definition': 'Reduce cycle time, benchmark, use customer demands, improve design precision (CAD), tighten production tolerances'},
    {'term': 'What is partner relationship management (PRM)?', 'definition': 'Ability for company and selling partners to trade information and distribute customer leads/data'},
    {'term': 'What is employee relationship management (ERM)?', 'definition': 'Handles employee issues closely related to CRM'},
    {'term': 'What is operational CRM?', 'definition': 'Customer-facing applications (sales force automation, call centers, marketing automation)'},
    {'term': 'What are menu costs in e-commerce?', 'definition': 'Merchant’s costs of changing prices (very low in digital markets)'},
    {'term': 'What is dynamic pricing?', 'definition': 'Price varies instantly based on consumer demand or seller supply'},
    {'term': 'What are the main e-commerce business models?', 'definition': 'Portal, e-tailer, content provider, transaction broker, market creator, service provider, community provider'},
    {'term': 'What is a portal (e-commerce business model)?', 'definition': 'Gateways to the web that users set as home page (e.g., Google)'},
    {'term': 'What is an e-tailer?', 'definition': 'Online retail stores selling physical products directly to consumers or businesses'},
    {'term': 'What is a content provider (e-commerce)?', 'definition': 'Creates revenue by providing digital content or selling advertising space'},
    {'term': 'What is a service provider (e-commerce)?', 'definition': 'Provides applications like photo/video sharing or online data storage'},
    {'term': 'What is a community provider?', 'definition': 'Online meeting place for people with similar interests (e.g., Facebook)'},
    {'term': 'Name the six e-commerce revenue models', 'definition': 'Advertising, sales, subscription, free/freemium, transaction fee, affiliate'},
    {'term': 'What is the advertising revenue model?', 'definition': 'Attracts large audience exposed to advertisements'},
    {'term': 'What is the subscription revenue model?', 'definition': 'Charges ongoing fee for access to content or services'},
    {'term': 'What is the free/freemium revenue model?', 'definition': 'Basic services free; premium charged for advanced features'},
    {'term': 'What is electronic data interchange (EDI)?', 'definition': 'Computer-to-computer exchange of standard business documents (invoices, purchase orders, etc.)'},
    {'term': 'What are private industrial networks?', 'definition': 'Secure website linking a large firm to its suppliers and partners for product design and development'},
    {'term': 'What are net marketplaces (e-hubs)?', 'definition': 'Single digital marketplace for many buyers and sellers; revenue from transactions and services'},
    {'term': 'Give examples of unstructured decisions', 'definition': 'Decide entrance/exit from markets, approve capital budget, decide long-term goals'},
    {'term': 'Give examples of structured decisions', 'definition': 'Determine overtime eligibility, restock inventory, offer credit to customers'},
    {'term': 'Give examples of semi-structured decisions', 'definition': 'Design marketing plan, develop departmental budget, design new corporate website'},
    {'term': 'What are the six components of the business intelligence environment?', 'definition': 'Data from business environment, BI infrastructure, analytics toolset, managerial users, delivery platform, user interface'},
    {'term': 'Name key BI and analytics capabilities', 'definition': 'Production reports, parameterized reports, dashboards/scorecards, ad hoc queries, drill down, orecasts/scenarios/models'},
    {'term': 'What is operational intelligence?', 'definition': 'Business activity monitoring for day-to-day operations'},
    {'term': 'What is location analytics?', 'definition': 'Uses geographic data and GIS to visualize problems and gain business insight'},
    {'term': 'What benefits do expert systems provide?', 'definition': 'Improved decisions, reduced errors/costs/training time, improved quality and service'},
    {'term': 'What is case-based reasoning?', 'definition': 'Past experiences stored as cases in a database for similar new problems'},
    {'term': 'What are fuzzy logic systems?', 'definition': 'Rule-based systems that handle approximate or subjective values'},
    {'term': 'What do neural networks do (and their limitation)?', 'definition': 'Find hidden patterns in massive data; cannot always explain their solutions'},
    {'term': 'What are enterprise-wide knowledge management systems?', 'definition': 'Enterprise content management, expert directories, learning management systems (LMS)'},
    {'term': 'What are examples of knowledge work systems?', 'definition': 'CAD, virtual reality, augmented reality'} 
];

for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
}

let currentIndex = 0;
let showingDefinition = false;

const content = document.getElementById("card-content");
const counter = document.getElementById("counter");
const cardElement = document.querySelector(".card");
const backBtn = document.getElementById("backBtn");

function showTerm() {
    cardElement.classList.remove("back");
    cardElement.classList.add("front");

    content.innerHTML = `<strong>${cards[currentIndex].term}</strong>
        <div class="hint">(Tap)</div>`;

    showingDefinition = false;
    counter.textContent = `Card ${currentIndex + 1} of ${cards.length}`;

    backBtn.style.display = currentIndex === 0 ? "none" : "inline-block";
}

function flipCard() {
    if (!showingDefinition) {
        cardElement.classList.remove("front");
        cardElement.classList.add("back");

        content.innerHTML = `${cards[currentIndex].definition}
            <div class="hint">(Tap)</div>`;

        showingDefinition = true;
    } else {
        showTerm();
    }
}

function nextCard() {
    currentIndex = (currentIndex + 1) % cards.length;
    showTerm();
}

function prevCard() {
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    showTerm();
}

// Start
showTerm();
</script>

</body>
</html>
