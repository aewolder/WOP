<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Essentials of MIS - Weeks 2-6 Flash Cards (Expanded)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: system-ui, Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    max-width: 460px;
    width: 100%;
    text-align: center;
}
.card {
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    padding: 30px 20px;
    font-size: 1.12em;
    cursor: pointer;
    user-select: none;
    min-height: 270px;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1.45;
}

/* NEW: front vs back colors */
.card.front {
    background: #dbeeff;
}

.card.back {
    background: white;
}

.hint {
    font-size: 0.82em;
    color: #666;
    margin-top: 14px;
}
button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.counter {
    margin-top: 10px;
    font-size: 0.85em;
    color: #555;
}
</style>
</head>
<body>

<div class="container">
    <div class="card front" onclick="flipCard()">
        <div id="card-content"></div>
    </div>

    <!-- NEW: Back button -->
    <button id="backBtn" onclick="prevCard()" style="display:none;">Back</button>
    <button onclick="nextCard()">Next Card</button>

    <div class="counter" id="counter"></div>
</div>

<script>
const cards = [
    {'term': 'What is social business?', 'definition': 'Use of social networking platforms to engage employees, customers, and suppliers'},
    {'term': 'Name two benefits of social business', 'definition': 'Increased productivity and innovation'},
    {'term': 'What is an intranet?', 'definition': 'A private company network using Internet technology'},
    {'term': 'What is a data warehouse?', 'definition': 'A system storing current and historical data for decision making'},
    {'term': 'What is a data mart?', 'definition': 'A subset of a data warehouse for specific users'}
    // (rest of your cards remain unchanged)
];

// Shuffle cards
for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
}

let currentIndex = 0;
let showingDefinition = false;

const content = document.getElementById("card-content");
const counter = document.getElementById("counter");
const cardElement = document.querySelector(".card");
const backBtn = document.getElementById("backBtn");

function showTerm() {
    cardElement.classList.remove("back");
    cardElement.classList.add("front");

    content.innerHTML = `<strong>${cards[currentIndex].term}</strong>
        <div class="hint">(Front)</div>`;

    showingDefinition = false;
    counter.textContent = `Card ${currentIndex + 1} of ${cards.length}`;

    // Show/hide back button
    backBtn.style.display = currentIndex === 0 ? "none" : "inline-block";
}

function flipCard() {
    if (!showingDefinition) {
        cardElement.classList.remove("front");
        cardElement.classList.add("back");

        content.innerHTML = `${cards[currentIndex].definition}
            <div class="hint">(Back)</div>`;

        showingDefinition = true;
    } else {
        showTerm();
    }
}

function nextCard() {
    currentIndex = (currentIndex + 1) % cards.length;
    showTerm();
}

function prevCard() {
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    showTerm();
}

// Start
showTerm();
</script>

</body>
</html>
