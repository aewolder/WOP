<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glossary Flash Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.card {
  width: 300px;
  height: 200px;
  perspective: 1000px;
  margin: 20px auto;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  border-radius: 12px;
  font-size: 18px;
  text-align: center;
}

.card-front {
  background: #4CAF50;
  color: white;
}

.card-back {
  background: #2196F3;
  color: white;
  transform: rotateY(180deg);
}

body {
    font-family: system-ui, Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    max-width: 420px;
    width: 100%;
    text-align: center;
}
.card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    padding: 30px 20px;
    font-size: 1.15em;
    cursor: pointer;
    user-select: none;
    min-height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.hint {
    font-size: 0.8em;
    color: #666;
    margin-top: 12px;
}
button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
}
.counter {
    margin-top: 10px;
    font-size: 0.85em;
    color: #555;
}
</style>
</head>
<body>

<div class="card" onclick="flipCard()">
  <div class="card-inner" id="cardInner">
    <div class="card-front" id="question"></div>
    <div class="card-back" id="answer"></div>
  </div>

    <button onclick="nextCard()">Next</button>
    <div class="counter" id="counter"></div>
</div>

<script>
alert("JS is running");
const cards = [const flashcards = [{q:"What are the main reasons collaboration is important in business?", a:"Changing nature of work, growth of professional work, changing organization, innovation, and business culture"},
{q:"What is social business?", a:"Use of social networking platforms to engage employees, customers, and suppliers"},
{q:"Name two benefits of social business", a:"Increased productivity and innovation"},
{q:"Give examples of collaboration tools", a:"Email, instant messaging, wikis, videoconferencing"},
{q:"What is same place–same time collaboration?", a:"Face-to-face interaction"},
{q:"What is different place–same time collaboration?", a:"Remote interaction like video conferencing"},
{q:"What is an intranet?", a:"A private company network using Internet technology"},
{q:"Who is the CIO?", a:"Chief Information Officer responsible for IT strategy"},
{q:"Who is the CSO?", a:"Chief Security Officer responsible for security awareness"},
{q:"Who is the CPO?", a:"Chief Privacy Officer ensuring compliance with data privacy laws"},
{q:"Who is the CKO?", a:"Chief Knowledge Officer managing knowledge programs"},
{q:"Who is the CDO?", a:"Chief Data Officer managing data governance and value"},
{q:"What are end users?", a:"Employees outside IT who use systems"},
{q:"What is a data warehouse?", a:"A system storing current and historical data for decision making"},
{q:"What is a data mart?", a:"A subset of a data warehouse for specific users"},
{q:"What is OLAP?", a:"Tool for multidimensional data analysis"},
{q:"What is data mining?", a:"Finding patterns and relationships in large datasets"},
{q:"What is text mining?", a:"Analyzing unstructured text data"},
{q:"What is data cleansing?", a:"Correcting inaccurate or incomplete data"},
{q:"What is an information policy?", a:"Rules for managing and sharing data"},
{q:"What is the value chain model?", a:"A model showing activities that add value to products/services"},
{q:"Name one primary activity in the value chain", a:"Operations"},
{q:"Name one support activity in the value chain", a:"Human resources"},
{q:"What is benchmarking?", a:"Comparing performance against standards"},
{q:"What is a value web?", a:"Network of firms coordinating value chains using IT"},
{q:"What are synergies?", a:"When outputs of one unit become inputs of another"},
{q:"What is a core competency?", a:"Activity where a firm is an industry leader"},
{q:"What is network economics?", a:"Value increases as more users join a network"},
{q:"What is a virtual company?", a:"Uses networks to collaborate without physical boundaries"},
{q:"What is total quality management (TQM)?", a:"Organization-wide effort to improve quality"},
{q:"What is Six Sigma?", a:"Quality standard of 3.4 defects per million opportunities"},
{q:"What is CRM?", a:"Systems managing customer interactions and data"},
{q:"What is a customer touch point?", a:"Any interaction with a customer"},
{q:"What is sales force automation?", a:"Tools to increase sales productivity"},
{q:"What is cross-selling?", a:"Selling complementary products"},
{q:"What is analytical CRM?", a:"Analyzing customer data for insights"},
{q:"What is customer lifetime value?", a:"Total value of a customer over time"},
{q:"What is churn rate?", a:"Percentage of customers who stop using a service"},
{q:"What is ubiquity in e-commerce?", a:"Availability everywhere at any time"},
{q:"What is global reach?", a:"Ability to conduct transactions worldwide"},
{q:"What is information density?", a:"Increased amount and quality of information"},
{q:"What is personalization?", a:"Tailoring products/services to individuals"},
{q:"What is information asymmetry?", a:"One party has more information than another"},
{q:"What are transaction costs?", a:"Costs of participating in a market"},
{q:"What is disintermediation?", a:"Removing intermediaries in a value chain"},
{q:"What is B2C e-commerce?", a:"Businesses selling to consumers"},
{q:"What is B2B e-commerce?", a:"Businesses selling to other businesses"},
{q:"What is a transaction broker?", a:"Processes transactions and saves time/money"},
{q:"What is a market creator?", a:"Platform where buyers and sellers meet and set prices"},
{q:"What is an affiliate revenue model?", a:"Earning commission by referring customers"},
{q:"What is behavioral targeting?", a:"Tracking user behavior to show ads"},
{q:"What is m-commerce?", a:"Buying/selling via mobile devices"},
{q:"What are location-based services?", a:"Services using geographic data (e.g., maps, nearby places)"}
];];

let flipped = false;

function flipCard() {
  const card = document.querySelector(".card");
  card.classList.toggle("flip");
  flipped = !flipped;
}


for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
}

let currentIndex = 0;
let showingDefinition = false;

const content = document.getElementById("card-content");
const counter = document.getElementById("counter");


function showCard(index) {
  const card = flashcards[index];
  document.getElementById("question").textContent = card.q;
  document.getElementById("answer").textContent = card.a;

  const cardElement = document.querySelector(".card");
  cardElement.classList.remove("flip"); // reset flip
  flipped = false;
}



function showTerm() {
    content.innerHTML = `<strong>${cards[currentIndex].term}</strong>
        <div class="hint">(Tap to see definition)</div>`;
    showingDefinition = false;
    counter.textContent = `Card ${currentIndex + 1} of ${cards.length}`;
}

function flipCard() {
    if (!showingDefinition) {
        content.innerHTML = `${cards[currentIndex].definition}
            <div class="hint">(Tap to see term)</div>`;
        showingDefinition = true;
    } else {
        showTerm();
    }
}

function nextCard() {
    currentIndex = (currentIndex + 1) % cards.length;
    showTerm();
}

showcard();
</script>

</body>
</html>
